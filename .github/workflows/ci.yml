name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude plugin directory validation
        run: node scripts/validate-plugin.mjs
      - name: Validate root plugin.json and mcp.json against Agent Plugins 1.0.0
        run: node scripts/validate-agent-plugin-schemas.mjs
