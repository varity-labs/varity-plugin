name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Claude plugin directory validation
        run: node scripts/validate-plugin.mjs
      - name: Check MCP pins and manifest versions agree, and validate root plugin.json and mcp.json against Agent Plugins 1.0.0
        run: node scripts/validate-agent-plugin-schemas.mjs
      - name: Copy policy (required skill lines, forbidden phrasings, policy fixtures)
        run: node scripts/validate-copy.mjs
      - name: Eval mocks match the pinned published @varity-labs/mcp
        run: |
          node scripts/gen-eval-mocks.mjs
          git diff --exit-code evals
